name: Tsavo Video Converter Android Build

on:
push:
branches: ["main"]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Set Up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set Up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK Packages
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

  - name: Install Gradle Wrapper
    run: |
      gradle wrapper --gradle-version 8.7
      chmod +x gradlew

  - name: Create Android Application Files
    run: |
      mkdir -p app/src/main/java/com/example/tsavovideoconverter

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application
              android:allowBackup="true"
              android:label="Tsavo Video Converter"
              android:supportsRtl="true"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity
                  android:name=".MainActivity"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF

      cat > app/src/main/java/com/example/tsavovideoconverter/MainActivity.kt <<'EOF'
      package com.example.tsavovideoconverter

      import android.app.Activity
      import android.os.Bundle
      import android.graphics.Color
      import android.view.Gravity
      import android.widget.LinearLayout
      import android.widget.TextView

      class MainActivity : Activity() {
          override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)

              window.statusBarColor = Color.rgb(5, 35, 25)
              window.navigationBarColor = Color.rgb(5, 35, 25)

              val layout = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  gravity = Gravity.CENTER
                  setPadding(28, 28, 28, 28)
                  setBackgroundColor(Color.rgb(5, 35, 25))
              }

              val title = TextView(this).apply {
                  text = "💚 TSAVO"
                  textSize = 32f
                  gravity = Gravity.CENTER
                  setTextColor(Color.rgb(80, 230, 160))
              }

              val subtitle = TextView(this).apply {
                  text = "VIDEO CONVERTER"
                  textSize = 23f
                  gravity = Gravity.CENTER
                  setTextColor(Color.WHITE)
                  setPadding(0, 20, 0, 16)
              }

              val message = TextView(this).apply {
                  text = "Created by Mwaliko Mghoi\\n\\nYour Android app starter is installed.\\nVideo conversion will be added in the next build."
                  textSize = 16f
                  gravity = Gravity.CENTER
                  setTextColor(Color.LTGRAY)
              }

              layout.addView(title)
              layout.addView(subtitle)
              layout.addView(message)
              setContentView(layout)
          }
      }
      EOF

  - name: Build Debug APK
    run: ./gradlew :app:assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: TsavoVideoConverter-Debug-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
