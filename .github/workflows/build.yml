name: Android Build Automation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Automatically Install Missing Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.7 --no-configuration-cache
        chmod +x gradlew

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon
      env:
        GRADLE_OPTS: "-Dorg.gradle.project.android.useAndroidX=true"

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TsavoVideoConverter-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
